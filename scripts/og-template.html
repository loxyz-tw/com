<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+TC:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #0a0a0f;
        color: #e4e4e7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 1080px;
        border: 2px solid #00d4ff;
        box-sizing: border-box;
        padding: 64px 72px;
      }
      .brand-en {
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        font-size: 56px;
        letter-spacing: 0.04em;
        color: #00d4ff;
        margin: 0 0 12px;
      }
      .brand-zh {
        font-family: "Noto Sans TC", sans-serif;
        font-weight: 700;
        font-size: 40px;
        margin: 0 0 28px;
        color: #e4e4e7;
      }
      .sub {
        font-family: "Noto Sans TC", sans-serif;
        font-weight: 700;
        font-size: 28px;
        color: #7c3aed;
        margin: 0 0 36px;
      }
      .url {
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        font-size: 22px;
        color: #00d4ff;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="brand-en">FUN TECH CO</p>
      <p class="brand-zh">丰科有限公司</p>
      <p class="sub">App、網站與 AI 應用開發</p>
      <p class="url">fun-tech.vip</p>
    </div>
  </body>
</html>
